<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Daily Planner</title>
<style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#263145;background:#f7f2ff}*{box-sizing:border-box}body{margin:0;padding:24px;display:grid;place-items:center;min-height:100vh}
main{width:min(100%,660px);padding:30px;background:white;border-radius:22px;box-shadow:0 12px 35px #49388918}p{line-height:1.6;color:#526079}
form{display:flex;flex-wrap:wrap;gap:10px}input{min-width:170px;flex:1;border:2px solid #bfb1dc;border-radius:10px;padding:13px;font-size:1rem}button{border:0;border-radius:10px;padding:12px 17px;background:#6943b8;color:white;cursor:pointer}
ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#65748d}li button{background:#fcecec;color:#9d2940}
button:focus-visible,input:focus-visible{outline:3px solid #e4ba48;outline-offset:2px}.hint{font-size:.85rem}</style></head><body><main>
<h1>📅 My Daily Planner</h1><p>Write down one small task. Check it off when you finish. Your list stays on this device and browser.</p>
<form id="taskForm"><label for="task">New task</label><input id="task" required maxlength="100" placeholder="Read 10 pages"><button>Add task</button></form>
<ul id="tasks" aria-label="Your tasks"></ul><p id="empty">No tasks yet. Add one above.</p><p class="hint">Privacy tip: Do not enter passwords or private details. Clearing browser storage may remove this list.</p>
</main><script>
const KEY='siva-beginner-planner-v1';const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[];}catch{return [];}}
let tasks=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{ /* App still works while open. */ }}
function render(){const list=$('tasks');list.replaceChildren();$('empty').hidden=tasks.length>0;
tasks.forEach((task,i)=>{const li=document.createElement('li');if(task.done)li.classList.add('done');
const box=document.createElement('input');box.type='checkbox';box.checked=!!task.done;box.setAttribute('aria-label','Completed: '+task.text);box.addEventListener('change',()=>{tasks[i].done=box.checked;save();render();});
const name=document.createElement('span');name.textContent=task.text;const del=document.createElement('button');del.type='button';del.textContent='Remove';del.setAttribute('aria-label','Remove '+task.text);del.addEventListener('click',()=>{tasks.splice(i,1);save();render();});
li.append(box,name,del);list.append(li);});}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const value=$('task').value.trim();if(!value)return;tasks.push({text:value,done:false});save();$('task').value='';render();$('task').focus();});render();
</script></body></html>
