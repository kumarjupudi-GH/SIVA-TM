<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Practice Spending Tracker</title>
<style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#1d3645;background:#eef6f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{margin:auto;width:min(100%,760px);background:white;border-radius:22px;padding:30px;box-shadow:0 12px 35px #3b657a1a}
p{line-height:1.55}.alert{color:#72551a;background:#fff6d7;padding:12px;border-radius:10px}form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end}label{display:block;font-weight:700;margin-bottom:4px}
input{width:100%;border:2px solid #b3d0d7;border-radius:10px;padding:12px;font:inherit}button{background:#15728b;color:white;border:0;border-radius:10px;padding:13px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffc857;outline-offset:2px}
ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e2edf1}li span{flex:1;overflow-wrap:anywhere}li button{background:#fce9eb;color:#92303f}.total{font-size:1.7rem;font-weight:800} @media(max-width:600px){form{grid-template-columns:1fr}}
</style></head><body><main><h1>💰 Practice Spending Tracker</h1>
<p class="alert">This is a learning exercise. Use pretend purchases and amounts only - no bank information or real financial records.</p>
<form id="form"><div><label for="item">Pretend purchase</label><input id="item" maxlength="60" required placeholder="Notebook"></div><div><label for="amount">Amount in dollars</label><input id="amount" required type="number" min="0.01" max="100000" step="0.01" placeholder="3.50"></div><button>Add</button></form>
<h2>My practice list</h2><ul id="list"></ul><p class="total" id="total" aria-live="polite"></p><p>Challenge: How would you show the largest purchase? Ask your AI assistant to explain the change first.</p>
</main><script>
const KEY='siva-spending-demo-v1';const $=id=>document.getElementById(id);
let rows=[];try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');rows=Array.isArray(parsed)?parsed:[];}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows));}catch{}}
function render(){const list=$('list');list.replaceChildren();let cents=0;rows.forEach((r,i)=>{const validCents=Number.isSafeInteger(r.cents)&&r.cents>0?r.cents:0;cents+=validCents;
const li=document.createElement('li');const span=document.createElement('span');span.textContent=r.name+' - $'+(validCents/100).toFixed(2);const b=document.createElement('button');b.textContent='Remove';b.type='button';b.addEventListener('click',()=>{rows.splice(i,1);save();render();});li.append(span,b);list.append(li);});
$('total').textContent='Total: $'+(cents/100).toFixed(2);if(!rows.length){const li=document.createElement('li');li.textContent='No pretend purchases yet.';list.append(li);}}
$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('item').value.trim();const amount=Number($('amount').value);if(!name||!Number.isFinite(amount)||amount<=0||amount>100000)return;
rows.push({name,cents:Math.round(amount*100)});save();$('form').reset();render();$('item').focus();});render();
</script></body></html>
